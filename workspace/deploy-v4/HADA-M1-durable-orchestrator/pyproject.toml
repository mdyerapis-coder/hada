[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hada"
version = "0.2.0"
description = "Governed autonomous development appliance for Hermesctl"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44,<47",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<7",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
hada = "hada.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hada.db" = ["migrations/*.sql"]
"hada.dashboard" = ["*.html", "*.css", "*.js", "*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Valkey"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hada"]
warn_unreachable = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
