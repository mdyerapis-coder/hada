# HADA M1 Production override for Google Cloud (hada-control VM)
#
# Applied on top of deploy/compose/compose.yaml:
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.gcp.yaml ...
#
# This override MUST be used together with the base compose.yaml.
# It is never used standalone.
#
# Human decisions applied (Phase A revision):
#   1. F-002: Docker named volumes with driver_opts bind mounts beneath
#      /var/lib/hada/docker-volumes/  (Docker global data-root is NOT relocated)
#   2. Caddy bound to localhost only; port 443 is NOT published.
#   3. ACME certificate issuance is disabled; localhost-only HTTP via IAP.
#   4. Orchestrator monitoring listener stays on 0.0.0.0:9108 (unpublished).
#
# Container UID/GID requirements (verified via skopeo inspect):
#   postgres  : UID 70,  GID 70   (postgres:17-alpine)
#   valkey    : UID 999, GID 1000 (valkey/valkey:8-alpine)
#   prometheus: UID 65534(nobody) (prom/prometheus:v3.2.1)
#   loki      : UID 10001,GID 10001 (grafana/loki:3.4.2)
#   alloy     : UID 473, GID 473 (grafana/alloy:v1.12.0)
#   grafana   : UID 472, GID 0   (grafana/grafana:11.5.2)
#   caddy     : UID 0,   GID 0   (caddy:2.10-alpine, runs as root)
#   orchestrator: UID 10001, GID 10001 (hada, built from Dockerfile)
#
# Directory ownership per service (Phase B host preparation):
#   /var/lib/hada/docker-volumes/postgres-data    -> 70:70   0750
#   /var/lib/hada/docker-volumes/valkey-data      -> 999:1000 0770
#   /var/lib/hada/docker-volumes/prometheus-data  -> 65534:65534 0755
#   /var/lib/hada/docker-volumes/loki-data        -> 10001:10001 0750
#   /var/lib/hada/docker-volumes/alloy-data       -> 473:473 0770
#   /var/lib/hada/docker-volumes/grafana-data     -> 472:0   0750
#   /var/lib/hada/docker-volumes/caddy-data       -> 0:0     0755
#   /var/lib/hada/docker-volumes/caddy-config     -> 0:0     0755
#   (Loki UID/GID 10001 matches hada; bootstrap creates hada 10001:10001)

services:
  caddy:
    ports: !override
      - "127.0.0.1:80:80"
    volumes:
      - ../caddy/Caddyfile.gcp:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
    driver_opts:
      type: none
      o: bind
      device: /var/lib/hada/docker-volumes/postgres-data
  valkey-data:
    driver_opts:
      type: none
      o: bind
      device: /var/lib/hada/docker-volumes/valkey-data
  prometheus-data:
    driver_opts:
      type: none
      o: bind
      device: /var/lib/hada/docker-volumes/prometheus-data
  loki-data:
    driver_opts:
      type: none
      o: bind
      device: /var/lib/hada/docker-volumes/loki-data
  alloy-data:
    driver_opts:
      type: none
      o: bind
      device: /var/lib/hada/docker-volumes/alloy-data
  grafana-data:
    driver_opts:
      type: none
      o: bind
      device: /var/lib/hada/docker-volumes/grafana-data
  caddy-data:
    driver_opts:
      type: none
      o: bind
      device: /var/lib/hada/docker-volumes/caddy-data
  caddy-config:
    driver_opts:
      type: none
      o: bind
      device: /var/lib/hada/docker-volumes/caddy-config
