name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq
      - name: Check shell scripts
        run: |
          mapfile -t scripts < <(find workspace scripts tests -type f -name '*.sh' 2>/dev/null || true)
          if ((${#scripts[@]})); then shellcheck "${scripts[@]}"; fi
      - name: Reject operator-local absolute paths
        run: scripts/ci/reject_operator_paths.sh
      - name: Validate release manifests
        run: scripts/ci/verify_release_manifests.sh
      - name: Run fast tests
        run: scripts/ci/run_fast_tests.sh
