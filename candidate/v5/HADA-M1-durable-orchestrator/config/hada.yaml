project:
  name: HADA
  target_name: Hermesctl
  # Verified reachable via `git ls-remote --exit-code <url> HEAD` (rc=0)
  # before being embedded here. Public repository: no authentication
  # required; no token is placed in .env, command arguments or evidence.
  target_repository: "https://github.com/mdyerapis-coder/hermesctl.git"
  target_ref: main
  workspace_root: /var/lib/hada/workspaces

governance:
  require_architecture_review: true
  require_security_review: true
  require_test_review: true
  require_documentation_update: true
  require_milestone_report: true
  require_external_review: true
  prohibit_self_approval: true
  prohibit_scope_expansion: true
  maximum_recovery_attempts: 3
  maximum_agent_iterations_per_gate: 5
  stop_on_critical_security_finding: true
  stop_on_external_review_unavailable: true

agents:
  implementation:
    party: 1
    role: implementation_engineer
    model: ""
    endpoint: http://inference-implementation:8000/v1
  adversarial:
    party: 2
    role: adversarial_reviewer
    model: ""
    endpoint: http://inference-adversarial:8000/v1
  external:
    party: 3
    role: independent_external_reviewer
    mode: manual

infrastructure:
  compose_files:
    - /opt/hada/deploy/compose/compose.yaml
    - /opt/hada/deploy/compose/compose.gcp.yaml
  health_check_interval_seconds: 30
  startup_timeout_seconds: 600
  recovery_backoff_seconds: 60

database:
  dsn_environment_variable: HADA_DATABASE_DSN
  migration_directory: /opt/hada/src/hada/db/migrations
  connect_timeout_seconds: 10
  statement_timeout_seconds: 30

queue:
  url_environment_variable: HADA_VALKEY_URL
  namespace: hada
  consumer_group: orchestrator
  visibility_timeout_seconds: 300
  maximum_delivery_attempts: 5
  maximum_stream_length: 10000

evidence:
  root: /var/lib/hada/evidence
  signing_private_key: /var/lib/hada/keys/audit-signing-key.pem
  signing_public_key: /var/lib/hada/keys/audit-signing-key.pub.pem

execution:
  require_bubblewrap: true
  trusted_binary_roots:
    - /usr/bin
    - /bin
    - /usr/local/bin
    - /opt/hada/.venv/bin
  readonly_bind_paths:
    - /usr
    - /bin
    - /lib
    - /lib64
    - /etc/alternatives
    - /etc/ssl
    - /opt/hada
  maximum_output_bytes: 1048576
  maximum_arguments: 128
  maximum_argument_length: 4096
  rules:
    - executable: git
      allowed_subcommands: [status, diff, show, log, rev-parse, grep, ls-files]
      allowed_parties: [1, 2]
      maximum_timeout_seconds: 120
      network_access: false
      read_only: true
    - executable: python3
      allowed_subcommands: [-m]
      allowed_parties: [1, 2]
      maximum_timeout_seconds: 900
      network_access: false
      read_only: false
    - executable: pytest
      allowed_subcommands: []
      allowed_parties: [1, 2]
      maximum_timeout_seconds: 900
      network_access: false
      read_only: false
    - executable: ruff
      allowed_subcommands: [check, format]
      allowed_parties: [1, 2]
      maximum_timeout_seconds: 300
      network_access: false
      read_only: false
    - executable: mypy
      allowed_subcommands: []
      allowed_parties: [1, 2]
      maximum_timeout_seconds: 600
      network_access: false
      read_only: false

monitoring:
  listen_host: 0.0.0.0
  listen_port: 9108
  dependency_probe_interval_seconds: 15
  unhealthy_exit_threshold: 4

security:
  allowed_egress_hosts:
    - github.com
    - api.github.com
    - objects.githubusercontent.com
  secrets_file: /opt/hada/.env
  require_non_root_runtime: true
  require_tls: true
  redact_logs: true
