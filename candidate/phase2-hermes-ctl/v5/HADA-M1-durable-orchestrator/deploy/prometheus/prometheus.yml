global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: hada-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:9108"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

rule_files:
  - /etc/prometheus/rules/*.yml
